<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Attachment Lens</title>
<style>
  :root {
    --bg: #0f1117;
    --surface: #1a1d27;
    --surface2: #242736;
    --border: #2e3147;
    --accent: #7c6af7;
    --accent2: #5dd9c4;
    --text: #e8eaf6;
    --muted: #8a8fa8;
    --anxious: #f77c6a;
    --avoidant: #6ab4f7;
    --fearful: #c96af7;
    --secure: #5dd99c;
    --healing: #f7c96a;
    --general: #8a8fa8;
    --revised-badge: #f7a26a;
    --radius: 10px;
    --shadow: 0 2px 12px rgba(0,0,0,0.4);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', system-ui, sans-serif; font-size: 15px; line-height: 1.6; }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }

  nav {
    position: sticky;
    top: 0;
    z-index: 200;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 10px 24px;
    display: flex;
    align-items: center;
    gap: 20px;
  }
  .font-ctrl { display: flex; align-items: center; gap: 5px; }
  .font-label { font-size: 11px; color: var(--muted); letter-spacing: .04em; margin-right: 2px; }
  .font-btn {
    background: var(--surface2); border: 1px solid var(--border);
    color: var(--text); border-radius: 5px; cursor: pointer;
    padding: 2px 8px; font-size: 14px; font-weight: 700; line-height: 1.5;
    transition: border-color .15s;
  }
  .font-btn:hover { border-color: var(--accent); color: var(--accent); }
  .font-size-display { font-size: 11px; color: var(--muted); min-width: 28px; text-align: center; }
  nav .brand { font-size: 20px; font-weight: 800; color: var(--text); letter-spacing: -.01em; }
  nav .brand span { color: var(--accent); }
  nav a.nav-link { color: var(--muted); font-size: 14px; }
  nav a.nav-link:hover { color: var(--text); text-decoration: none; }
  nav .spacer { flex: 1; }
  .btn {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 8px 16px; border-radius: 6px; border: none;
    cursor: pointer; font-size: 14px; font-weight: 600;
    transition: opacity .15s, transform .1s;
  }
  .btn:hover { opacity: .85; transform: translateY(-1px); }
  .btn:active { transform: translateY(0); }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-secondary { background: var(--surface2); color: var(--text); border: 1px solid var(--border); }
  .btn-danger { background: #c0392b; color: #fff; }
  .btn-sm { padding: 5px 10px; font-size: 12px; }

  .container { width: 100%; max-width: 100%; padding: 24px 28px; box-sizing: border-box; }

  .section-title {
    font-size: 13px; font-weight: 700; letter-spacing: .08em;
    text-transform: uppercase; color: var(--muted); margin-bottom: 14px;
  }
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 18px 20px;
    box-shadow: var(--shadow);
  }

  /* Category color dots */
  .cat-badge {
    display: inline-block; padding: 2px 10px; border-radius: 20px;
    font-size: 11px; font-weight: 700; letter-spacing: .04em;
  }
  .cat-Anxious { background: rgba(247,124,106,.18); color: var(--anxious); }
  .cat-Avoidant { background: rgba(106,180,247,.18); color: var(--avoidant); }
  .cat-Fearful { background: rgba(201,106,247,.18); color: var(--fearful); }
  .cat-Secure { background: rgba(93,217,156,.18); color: var(--secure); }
  .cat-Healing { background: rgba(247,201,106,.18); color: var(--healing); }
  .cat-General { background: rgba(138,143,168,.18); color: var(--general); }

  .revised-badge {
    display: inline-block; padding: 2px 8px; border-radius: 20px;
    font-size: 11px; font-weight: 700; background: rgba(247,162,106,.18);
    color: var(--revised-badge);
  }
  .original-badge {
    display: inline-block; padding: 2px 8px; border-radius: 20px;
    font-size: 11px; font-weight: 700; background: rgba(138,143,168,.1);
    color: var(--muted);
  }
</style>
</head>
<body>
<nav>
  <span class="brand">Attachment<span>Lens</span></span>
  <a href="/" class="nav-link">Home</a>
  <a href="/#favorites" class="nav-link">⭐ Favorites</a>
  <a href="/insights" class="nav-link">✨ Insights</a>
  <a href="/ai-insights" class="nav-link">🧠 AI Insights</a>
  <a href="/import" class="nav-link">Import Posts</a>
  <span class="spacer"></span>
  <div class="font-ctrl">
    <span class="font-label">TEXT</span>
    <button class="font-btn" onclick="adjustFont(-1)" title="Decrease font size">A−</button>
    <span class="font-size-display" id="font-size-display">15</span>
    <button class="font-btn" onclick="adjustFont(1)" title="Increase font size">A+</button>
  </div>
</nav>
<div id="page-content">{% block content %}{% endblock %}</div>
<script>
(function() {
  // Zoom levels: 80% → 200% in steps
  const ZOOMS = [0.8, 0.85, 0.9, 0.95, 1.0, 1.1, 1.2, 1.35, 1.5, 1.75, 2.0];
  const LABELS = ['80%','85%','90%','95%','100%','110%','120%','135%','150%','175%','200%'];
  let idx = parseInt(localStorage.getItem('zoomIdx') ?? '4');
  function apply() {
    const z = ZOOMS[idx];
    document.getElementById('page-content').style.zoom = z;
    const el = document.getElementById('font-size-display');
    if (el) el.textContent = LABELS[idx];
  }
  window.adjustFont = function(dir) {
    idx = Math.max(0, Math.min(ZOOMS.length - 1, idx + dir));
    localStorage.setItem('zoomIdx', idx);
    apply();
  };
  apply();
})();
</script>
</body>
</html>
