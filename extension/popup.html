<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>AttachmentLens Importer</title>
<style>
  body {
    width: 320px; margin: 0; padding: 14px 16px 16px;
    font: 13px/1.5 -apple-system, Segoe UI, Roboto, sans-serif;
    background: #14161a; color: #e8e8ea;
  }
  h1 { font-size: 14px; margin: 0 0 10px; }
  .row { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
  .row label { font-weight: 600; }
  input[type="number"] {
    width: 64px; padding: 5px 7px; background: #1e2126; border: 1px solid #333740;
    border-radius: 6px; color: #e8e8ea; font-size: 13px; text-align: center;
  }
  button {
    display: block; width: 100%; padding: 9px 12px; margin-bottom: 8px;
    border: none; border-radius: 6px; background: #4c8bf5; color: #fff;
    font-size: 13px; font-weight: 600; cursor: pointer;
  }
  button:disabled { opacity: .5; cursor: default; }
  button.secondary { background: #2a2d33; color: #e8e8ea; border: 1px solid #3a3d44; }
  #status {
    font-size: 12px; color: #9aa0aa; min-height: 32px; margin-bottom: 8px;
    white-space: pre-wrap;
  }
  #status.error { color: #e07a7a; }
  #status.success { color: #6fcf97; }
  #not-fb {
    font-size: 12px; color: #e0b46a; background: rgba(224,180,106,.1);
    border: 1px solid rgba(224,180,106,.3); border-radius: 6px; padding: 8px 10px;
    margin-bottom: 10px; display: none;
  }
  a { color: #7aa2f7; }
  .footer { text-align: center; margin-top: 4px; }
  .footer a { font-size: 11px; }
  .links {
    display: flex; flex-direction: column; gap: 4px;
    margin-bottom: 12px; padding-bottom: 10px; border-bottom: 1px solid #262a31;
  }
  .links a { font-size: 12px; text-decoration: none; }
  .links a:hover { text-decoration: underline; }
  #import-result {
    display: none; font-size: 13px; font-weight: 700; border-radius: 6px;
    padding: 8px 10px; margin-bottom: 8px;
  }
  #import-result.success { background: rgba(111,207,151,.12); color: #6fcf97; }
  #import-result.error { background: rgba(224,122,122,.12); color: #e07a7a; }
</style>
</head>
<body>
  <h1>AttachmentLens Importer</h1>

  <div class="links">
    <a id="fb-link" href="#" target="_blank">📘 Open Facebook profile</a>
    <a id="app-link" href="#" target="_blank">🔗 Open AttachmentLens</a>
  </div>

  <div id="not-fb">Open a Facebook profile tab first — this only works on facebook.com.</div>

  <div class="row">
    <label for="target">Posts to scrape</label>
    <input type="number" id="target" value="20" min="1" max="500">
  </div>

  <button id="scrape-btn">Scrape Recent Posts</button>
  <div id="status"></div>

  <button id="import-btn" class="secondary" disabled>Import to AttachmentLens</button>
  <div id="import-result"></div>
  <button id="copy-btn" class="secondary" disabled>Copy JSON</button>

  <div class="footer"><a href="#" id="options-link">Options</a></div>

  <script src="scraper-fn.js"></script>
  <script src="popup.js"></script>
</body>
</html>
