services:
  attachmentlens:
    build: .
    ports:
      - "5000:5000"
    volumes:
      # Mount local directory to persist database
      - ./data:/app/data
    environment:
      # Store database in the volume
      - DB_PATH=/app/data/posts.db
      # Optional: API keys (from host .env file or pass via -e flag)
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
    restart: unless-stopped
    env_file:
      - .env
