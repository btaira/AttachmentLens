name: AttachmentLens Test Suite (Linux)

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install flask requests

      - name: Start Flask app in background
        run: |
          python app.py > flask.log 2>&1 &
          FLASK_PID=$!
          echo "Flask started with PID: $FLASK_PID"
          sleep 5

          # Wait for Flask to be ready
          for i in {1..30}; do
            if curl -s http://localhost:5000/ > /dev/null 2>&1; then
              echo "[OK] Flask is ready"
              break
            fi
            if [ $i -eq 30 ]; then
              echo "[ERROR] Flask failed to start"
              cat flask.log
              exit 1
            fi
            echo "Waiting for Flask... ($i/30)"
            sleep 1
          done

      - name: Run Comprehensive Tests
        id: comprehensive
        run: |
          echo "Running comprehensive tests..."
          python tests/runners/comprehensive_test.py
          echo "Status: $?"

      - name: Run Extended Tests
        id: extended
        run: |
          echo "Running extended tests..."
          python tests/runners/extended_tests.py
          echo "Status: $?"

      - name: Run User Flow Tests
        id: user_flows
        run: |
          echo "Running user flow tests..."
          python tests/runners/user_flow_tests.py
          echo "Status: $?"

      - name: Check test results
        if: always()
        run: |
          echo "Looking for test results..."
          if [ -d "test_runs" ]; then
            echo "✓ Found test_runs directory"
            ls -lah test_runs/
          else
            echo "[ERROR] No test_runs directory found"
          fi

      - name: Display test summary
        if: always() && hashFiles('test_runs/TESTS_FINAL_REPORT.md') != ''
        run: |
          echo "## Test Results" >> $GITHUB_STEP_SUMMARY
          cat test_runs/TESTS_FINAL_REPORT.md >> $GITHUB_STEP_SUMMARY || true

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-linux
          path: test_runs/
          retention-days: 30
          if-no-files-found: ignore

      - name: Post PR comment
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let comment = '## 🧪 Test Results\n\n';

            if (fs.existsSync('test_runs/TESTS_FINAL_REPORT.md')) {
              try {
                const report = fs.readFileSync('test_runs/TESTS_FINAL_REPORT.md', 'utf8');
                comment += report.substring(0, 1000) + '\n\n';
                comment += '[View full report](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})';
              } catch (e) {
                comment += '⚠️ Error reading report\n';
              }
            } else {
              comment += '⚠️ No test report generated\n';
              comment += 'Check the workflow logs for details.';
            }

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
