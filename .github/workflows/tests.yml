name: AttachmentLens Test Suite

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    # Run tests daily at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:
    # Allow manual trigger

jobs:
  test:
    name: Run Tests
    runs-on: windows-latest

    strategy:
      matrix:
        python-version: ['3.12']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flask requests

      - name: Start Flask app
        run: |
          Start-Process python -ArgumentList "app.py" -WindowStyle Hidden
          Start-Sleep -Seconds 3
        shell: powershell

      - name: Wait for Flask to be ready
        run: |
          $retries = 30
          while ($retries -gt 0) {
            try {
              $response = Invoke-WebRequest -Uri "http://localhost:5000" -ErrorAction Stop
              Write-Host "Flask is ready"
              exit 0
            } catch {
              $retries--
              if ($retries -eq 0) {
                Write-Host "Flask failed to start"
                exit 1
              }
              Start-Sleep -Seconds 1
            }
          }
        shell: powershell

      - name: Run Comprehensive Tests
        run: |
          python tests/runners/comprehensive_test.py
        continue-on-error: true

      - name: Run Extended Tests
        run: |
          python tests/runners/extended_tests.py
        continue-on-error: true

      - name: Run User Flow Tests
        run: |
          python tests/runners/user_flow_tests.py
        continue-on-error: true

      - name: Generate Test Summary
        if: always()
        run: |
          # Create a summary of test results
          if (Test-Path "test_runs/TESTS_FINAL_REPORT.md") {
            $content = Get-Content "test_runs/TESTS_FINAL_REPORT.md" -Raw
            Write-Output "## Test Results Summary" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
            Write-Output "" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
            Write-Output $content | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          }
        shell: powershell

      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: test-reports
          path: test_runs/
          retention-days: 30

      - name: Comment PR with Results
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let comment = '## 🧪 Test Results\n\n';

            if (fs.existsSync('test_runs/TESTS_FINAL_REPORT.md')) {
              const content = fs.readFileSync('test_runs/TESTS_FINAL_REPORT.md', 'utf8');
              // Extract key metrics
              const passMatch = content.match(/Total Passed.*?(\d+)/);
              const failMatch = content.match(/Total Failed.*?(\d+)/);

              if (passMatch && failMatch) {
                const passed = passMatch[1];
                const failed = failMatch[1];
                const total = parseInt(passed) + parseInt(failed);
                const rate = ((parseInt(passed) / total) * 100).toFixed(1);

                comment += `**Overall Results**: ${passed}/${total} tests passed (${rate}%)\n\n`;

                if (failed > 0) {
                  comment += `⚠️ **${failed} test(s) failed** - See artifacts for details\n\n`;
                } else {
                  comment += `✅ **All tests passed!**\n\n`;
                }
              }
            } else {
              comment += '⚠️ Test reports not found\n\n';
            }

            comment += '📊 [View detailed reports](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})';

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
        shell: bash

  test-summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: test
    if: always()

    steps:
      - name: Check test status
        run: |
          if [ "${{ needs.test.result }}" == "failure" ]; then
            echo "❌ Tests failed"
            exit 1
          else
            echo "✅ Tests passed"
          fi
