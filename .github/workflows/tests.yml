name: AttachmentLens Test Suite (Windows)

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  test:
    name: Run Tests on Windows
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install flask requests

      - name: Start Flask app
        shell: powershell
        run: |
          Write-Host "Starting Flask app..."
          $process = Start-Process python -ArgumentList "app.py" -WindowStyle Hidden -PassThru
          Write-Host "Flask process ID: $($process.Id)"
          Start-Sleep -Seconds 5

          # Wait for Flask to be ready
          $ready = $false
          for ($i = 1; $i -le 30; $i++) {
            try {
              $response = Invoke-WebRequest -Uri "http://localhost:5000/" -ErrorAction Stop -TimeoutSec 2
              Write-Host "[OK] Flask is ready"
              $ready = $true
              break
            } catch {
              if ($i -eq 30) {
                Write-Host "✗ Flask failed to start after 30 seconds"
                exit 1
              }
              Write-Host "Waiting for Flask... ($i/30)"
              Start-Sleep -Seconds 1
            }
          }

          if (-not $ready) {
            exit 1
          }

      - name: Run Comprehensive Tests
        shell: powershell
        continue-on-error: true
        run: |
          Write-Host "Running comprehensive tests..."
          python tests/runners/comprehensive_test.py
          Write-Host "Exit code: $LASTEXITCODE"

      - name: Run Extended Tests
        shell: powershell
        continue-on-error: true
        run: |
          Write-Host "Running extended tests..."
          python tests/runners/extended_tests.py
          Write-Host "Exit code: $LASTEXITCODE"

      - name: Run User Flow Tests
        shell: powershell
        continue-on-error: true
        timeout-minutes: 10
        run: |
          Write-Host "Running user flow tests..."
          python tests/runners/user_flow_tests.py
          Write-Host "Exit code: $LASTEXITCODE"

      - name: Check test results
        if: always()
        shell: powershell
        run: |
          Write-Host "Checking for test results..."
          if (Test-Path "test_runs") {
            Write-Host "[OK] Found test_runs directory"
            Get-ChildItem -Path "test_runs" -Recurse
          } else {
            Write-Host "✗ No test_runs directory found"
          }

      - name: Display test summary
        if: always() && hashFiles('test_runs/TESTS_FINAL_REPORT.md') != ''
        shell: powershell
        run: |
          $report = Get-Content "test_runs/TESTS_FINAL_REPORT.md" -Raw
          "## Test Results`n`n$report" | Add-Content -Path $env:GITHUB_STEP_SUMMARY

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-windows
          path: test_runs/
          retention-days: 30
          if-no-files-found: ignore

      - name: Post PR comment
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let comment = '## 🧪 Test Results (Windows)\n\n';

            if (fs.existsSync('test_runs/TESTS_FINAL_REPORT.md')) {
              try {
                const report = fs.readFileSync('test_runs/TESTS_FINAL_REPORT.md', 'utf8');
                comment += report.substring(0, 1000) + '\n\n';
                comment += '[View full report](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})';
              } catch (e) {
                comment += '⚠️ Error reading report\n';
              }
            } else {
              comment += '⚠️ No test report generated\n';
              comment += 'Check the workflow logs for details.';
            }

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
